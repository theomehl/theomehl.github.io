content: 
  - name: blog
    label: Blog
    type: collection
    path: 'src/blog'
    view: 
      fields: [ title, date, draft]
    fields: 
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: date
        label: Date
        type: date
      - name: tags
        label: Tags
        type: string
        list: true
        fields: 
          - name: tag
            label: Tag
            type: string
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
  - name: notes
    label: Notes
    type: collection
    path: 'src/notes'
    filename: 
      template: "{year}-{month}-{day}-{hour}-{minute}.md"
    view: 
      fields: [ title, date, draft]
    fields: 
      - name: title
        label: Title
        type: string
        hidden: true
      - name: description
        label: Description
        type: string
        hidden: true
      - name: date
        label: Date
        type: date
        options: 
          time: true
          format: yyyy-MM-dd'T'HH:mm'Z'
      - name: tags
        label: Tags
        type: string
        list: true
        fields: 
          - name: tag
            label: Tag
            type: string
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
  - name: commonplace
    label: Commonplace Book
    type: collection
    path: 'src/commonplace'
    view: 
      fields: [ title, date, draft]
    fields: 
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: originalDate
        label: Original Publish Date
        type: date
      - name: date
        label: Updated Date
        type: date
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text
  - name: books
    label: For Fun Books
    type: file
    path: '_data/books.json'
    format: json
    list: true
    fields: 
      - name: title
        label: Title
        type: string
      - name: author
        label: Author
        type: string
      - name: notesUrl
        label: Notes URL (path to .md file)
        type: string
      - name: status
        label: Status
        type: string
      - name: completionDate
        label: completionDate
        type: date
        default: ""
        options: 
          format: yyyy-MM-dd
  - name: gifts
    label: Gifts
    type: file
    path: 'src/gifts.md'
    fields: 
      - name: layout
        label: Layout
        type: select
        options: 
          values:
            - value: 'layouts/single-page.njk'
              label: Single Page
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: date
        label: Date
        type: date
      - name: draft
        label: Draft
        type: boolean
      - name: body
        label: Body
        type: rich-text